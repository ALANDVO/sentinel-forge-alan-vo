name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Install dependencies
        run: .venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: PYTHONPATH=backend .venv/bin/python -m pytest backend/tests -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Frontend typecheck and build
        run: npm run build
        working-directory: ./frontend

      - name: Frontend tests
        run: npm test
        working-directory: ./frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false

      - name: Build frontend Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false