services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-forge-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: "sqlite:////data/sentinel_forge.db"
      DEMO_MODE: "true"
      APP_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://127.0.0.1:5173,http://127.0.0.1:8080"
    volumes:
      - backend-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinel-forge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_started

  keycloak:
    image: "quay.io/keycloak/keycloak:26.0"
    container_name: sentinel-forge-keycloak
    command: start-dev
    profiles: ["auth"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_HOSTNAME: "127.0.0.1"
      KC_HOSTNAME_PORT: "8081"
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "change-me"
    volumes:
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  backend-data:
  keycloak-data: